[project]
name = "igrinsdr"
dynamic = ["version"]
description = "IGRINS pipeline for DRAGONS"
authors = [
    {name = "Jae-Joon Lee", email = "lee.j.joon@gmail.com"}
]

[tool.poetry]
name = "igrinsdr"
version = "0.1.1"
description = ""
authors = ["Jae-Joon Lee <lee.j.joon@gmail.com>"]

packages = [
    { include = "igrinsdr", from = 'src'},
    { include = "igrins_instruments", from = 'src'},
]

include = [
    "igrinsdr/igrins/lookups/ref_data/*",
    # "igrinsdr/igrins/lookups/ref_data/H-band_sky_mask_igrins2.fits",
    # "igrinsdr/igrins/lookups/ref_data/K-band_sky_mask_igrins2.fits"
]

exclude = [
  "test/**/*",
  "test_i2/**/*",
  "test_flat_with_bundle_recipe/**/*"
]

[tool.poetry.dependencies]
#python = ">3.7.1"
#pandas = ">1.3"
dragons = ">=4.1.0"
# astroscrappy = ">=1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1"

# [tool.poetry.scripts]
# mef_extract = "igrinsdr.igrins.mef_extract:main"

[build-system]
requires = ["poetry-core>=1.0.0", "setuptools-scm>=7.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools_scm]
write_to = "src/igrinsdr/_version.py"
write_to_template = """
# This file is auto-generated by setuptools-scm
try:
    __version__ = "{version}"
    __version_tuple__ = version_tuple = {version_tuple}
except Exception:
    __version__ = "0.0.0"
    __version_tuple__ = version_tuple = (0, 0, 0)
"""

# Documentation dependencies
[project.optional-dependencies]
doc = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "autoapi>=2.0.0",  # Required for autoapi.sphinx
    "numpydoc>=1.2.0",
    "myst-parser>=0.18.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-gallery>=0.10.0",
]

